bundle:
  name: tui-conversation-models
  version: 0.1.0
providers:
  - module: provider-anthropic
    id: anthropic-haiku
    instance_id: anthropic-haiku
    source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@12fffb6ad2bafb1bb7999ab02245a35e42ca8672
    config:
      default_model: claude-haiku-4-5
      priority: 10
      max_tokens: 1024
      max_retries: 1
      raw: false
  - module: provider-anthropic
    id: anthropic-sonnet
    instance_id: anthropic-sonnet
    source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@12fffb6ad2bafb1bb7999ab02245a35e42ca8672
    config:
      default_model: claude-sonnet-4-5
      priority: 20
      max_tokens: 1024
      max_retries: 1
      raw: false
