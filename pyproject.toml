[project]
name = "amplifier-app-tui"
version = "0.4.0rc2"
description = "An optional terminal client for Amplifier Unified"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4"]

[project.optional-dependencies]
standalone = [
  "amplifier-core @ git+https://github.com/microsoft/amplifier-core@main",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
  "amplifier-app-cli @ git+https://github.com/microsoft/amplifier-app-cli@main",
  "textual==8.2.8",
  "pillow==12.1.1",
]

[project.scripts]
amplifier-tui = "amplifier_tui.launcher:main"
amplifier-tui-host = "amplifier_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["**/*.zip", "**/node_modules/**", "**/target/**", ".state/**", ".evidence/**", ".venv/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_tui"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "frontends/ratatui/src", "frontends/ratatui/Cargo.toml", "frontends/ratatui/Cargo.lock", "hatch_build.py", "pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "pillow==12.1.1",
    "pyte==0.8.2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
